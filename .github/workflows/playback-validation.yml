name: Playback validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'public/audio-cache-worker.js'
      - '*config*'
      - 'package*.json'
      - '.github/workflows/playback-validation.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint src vite.config.ts
      - run: npm run build
